<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Arrière-plan espace -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b0d1b"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>

    <!-- Dégradé Galaxie Gabon (Vert Émeraude -> Cyan -> Violet Cosmique) -->
    <linearGradient id="galaxyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#7B2CBF"/>
    </linearGradient>

    <!-- Dégradé Anneau 360 -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Effet Neon Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond Spatiale -->
  <rect width="800" height="500" fill="url(#spaceBg)" rx="16"/>

  <!-- Étoiles en arrière-plan -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="150" cy="80" r="1.5"/>
    <circle cx="680" cy="120" r="2"/>
    <circle cx="220" cy="380" r="1"/>
    <circle cx="720" cy="390" r="1.5"/>
    <circle cx="100" cy="250" r="2"/>
  </g>

  <!-- Groupe Icône Galaxie / 360 -->
  <g transform="translate(400, 190)">
    <!-- Anneau Orbital Arrière (360°) -->
    <ellipse cx="0" cy="0" rx="140" ry="45" fill="none" stroke="url(#orbitGrad)" stroke-width="3" transform="rotate(-20)" filter="url(#glow)"/>
    
    <!-- Noyau Galactique / G Stylisé -->
    <path d="M 40 -10 A 50 50 0 1 0 -10 50 L 25 50 C 15 20 -10 15 -20 -10 C -30 -30 0 -50 30 -30 C 50 -15 40 -10 40 -10 Z" 
          fill="url(#galaxyGrad)" filter="url(#glow)"/>

    <!-- Point lumineux central (Noyau) -->
    <circle cx="0" cy="0" r="12" fill="#FFFFFF" filter="url(#glow)"/>

    <!-- Anneau Orbital Avant avec nœuds de connexion -->
    <ellipse cx="0" cy="0" rx="140" ry="45" fill="none" stroke="url(#galaxyGrad)" stroke-width="4" stroke-dasharray="180 60" transform="rotate(-20)" filter="url(#glow)"/>
    
    <!-- Nœuds de réseau sur l'orbite -->
    <circle cx="110" cy="-35" r="5" fill="#00FF88" filter="url(#glow)"/>
    <circle cx="-120" cy="25" r="4" fill="#00D2FF" filter="url(#glow)"/>
  </g>

  <!-- Typographie Futuriste -->
  <text x="400" y="360" text-anchor="middle" font-family="'Space Grotesk', 'Orbitron', 'Segoe UI', sans-serif" font-weight="900" font-size="38" letter-spacing="2" fill="#FFFFFF">
    GABON<tspan fill="#00D2FF">CONNECT</tspan><tspan fill="#00FF88" font-size="42">360</tspan>
  </text>
  
  <text x="400" y="395" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="400" font-size="13" letter-spacing="8" fill="#A0AABF">
    NEXT-GEN DIGITAL GALAXY
  </text>
</svg>
